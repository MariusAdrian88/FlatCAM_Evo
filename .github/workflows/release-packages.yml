name: Release Linux and macOS packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload to
        required: true
        type: string
      source_ref:
        description: Branch, tag or commit to build from (empty = the release tag)
        required: false
        default: ''
        type: string
      publish:
        description: Upload packages to the release (disable for a validation build)
        default: true
        type: boolean
      linux_only:
        description: Build only the Linux AppImage
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.linux_only && '[{"os":"ubuntu-22.04","platform":"linux","arch":"x86_64"}]' || '[{"os":"ubuntu-22.04","platform":"linux","arch":"x86_64"},{"os":"macos-15","platform":"macos","arch":"arm64"}]') }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_REPO: ${{ github.repository }}
      PACKAGE_PLATFORM: ${{ matrix.platform }}
      PACKAGE_ARCH: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || format('refs/tags/{0}', env.RELEASE_TAG) }}
          persist-credentials: false

      - name: Check release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" --repo "$GH_REPO"

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libpulse0 zsync

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: '3.13'
          activate-environment: flatcam-build
          channels: conda-forge
          channel-priority: strict

      - name: Install native and Python dependencies
        env:
          CONDA_OVERRIDE_GLIBC: ${{ matrix.platform == 'linux' && '2.28' || '' }}
          PIP_CONSTRAINT: ${{ matrix.platform == 'linux' && format('{0}/scripts/constraints-linux.txt', github.workspace) || '' }}
        run: |
          conda install -y gdal 'rasterio>=1.4.0' freetype tk pillow 'numpy>=2'
          if [[ "$PACKAGE_PLATFORM" == linux ]]; then
            conda install -y libxkbcommon xcb-util-cursor xcb-util-wm xcb-util-keysyms \
              cxx-compiler 'sysroot_linux-64=2.28' 'freeze-core>=0.6.1'
            conda activate flatcam-build
          fi
          python -m pip install -r requirements.txt 'ortools==9.14.6206' 'cx-Freeze==8.7.3'
          python install_optional.py
          python -m pip check
          python -c 'import os, platform; assert platform.machine() == os.environ["PACKAGE_ARCH"], platform.machine()'

      - name: Build AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPIMAGE_UPDATE_INFORMATION: gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|FlatCAM_EVO-*-linux-${{ matrix.arch }}.AppImage.zsync
        run: LD_LIBRARY_PATH="$CONDA_PREFIX/lib" python scripts/freeze_release.py bdist_appimage

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          python scripts/freeze_release.py bdist_mac
          codesign --force --deep --sign - build/FlatCAM_EVO.app
          codesign --verify --deep --strict build/FlatCAM_EVO.app

      - name: Check frozen application
        run: |
          if [[ "$PACKAGE_PLATFORM" == linux ]]; then
            umask 022
            image=(dist/*.AppImage)
            "${image[0]}" --appimage-extract
            python scripts/check_glibc.py squashfs-root
            python scripts/check_release.py squashfs-root/AppRun
          else
            python scripts/check_release.py build/FlatCAM_EVO.app/Contents/MacOS/FlatCAM
          fi

      - name: Create DMG from signed app
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/dmg
          cp -R build/FlatCAM_EVO.app build/dmg/
          ln -s /Applications build/dmg/Applications
          mkdir -p dist
          hdiutil create -volname 'FlatCAM EVO' -srcfolder build/dmg -ov -format UDZO dist/FlatCAM_EVO.dmg
          hdiutil verify dist/FlatCAM_EVO.dmg

      - name: Check Linux GUI without network or build-host libraries
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: |
          docker build -t flatcam-appimage-smoke -f scripts/appimage-smoke.Dockerfile scripts
          mkdir -p build/gui-smoke
          ls -ld squashfs-root squashfs-root/AppRun squashfs-root/FlatCAM
          timeout --kill-after=10s 180s docker run --rm --init --network none --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/squashfs-root:/app:ro" \
            -v "$PWD/scripts/check_appimage.sh:/check_appimage.sh:ro" \
            -v "$PWD/build/gui-smoke:/results" \
            flatcam-appimage-smoke
          python - <<'PY'
          import numpy as np
          from PIL import Image

          frame = np.load('build/gui-smoke/canvas.npy', allow_pickle=False)
          if frame.ndim != 3 or frame.shape[2] != 4 or np.ptp(frame[:, :, :3]) == 0:
              raise RuntimeError('VisPy did not render a nonblank RGBA framebuffer')
          Image.fromarray(frame).save('build/gui-smoke/canvas.png')
          PY

      - name: Save rendered VisPy canvas
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: FlatCAM_EVO-linux-canvas
          path: build/gui-smoke/canvas.png
          if-no-files-found: error

      - name: Name release asset
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          suffix = '.AppImage' if os.environ['PACKAGE_PLATFORM'] == 'linux' else '.dmg'
          packages = list(Path('dist').glob('*' + suffix))
          if len(packages) != 1:
              raise RuntimeError(f'Expected exactly one {suffix} package, found {packages}')
          tag = re.sub(r'[^A-Za-z0-9._-]', '_', os.environ['RELEASE_TAG'])
          name = f"FlatCAM_EVO-{tag}-{os.environ['PACKAGE_PLATFORM']}-{os.environ['PACKAGE_ARCH']}{suffix}"
          destination = packages[0].with_name(name)
          packages[0].rename(destination)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f'RELEASE_ASSET={destination.as_posix()}\n')
          PY

      - name: Make AppImage zsync file
        if: runner.os == 'Linux'
        env:
          APPIMAGE_UPDATE_INFORMATION: gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|FlatCAM_EVO-*-linux-${{ matrix.arch }}.AppImage.zsync
        run: |
          embedded="$("$RELEASE_ASSET" --appimage-updateinformation)"
          if [[ "$embedded" != "$APPIMAGE_UPDATE_INFORMATION" ]]; then
            echo "Embedded update information is '$embedded', expected '$APPIMAGE_UPDATE_INFORMATION'" >&2
            exit 1
          fi
          # appimagetool names its .zsync after the build name; make it again for the renamed asset.
          rm -f dist/*.zsync
          name="$(basename "$RELEASE_ASSET")"
          (cd dist && zsyncmake -u "$name" -o "$name.zsync" "$name")
          echo "RELEASE_ZSYNC=$RELEASE_ASSET.zsync" >> "$GITHUB_ENV"

      - name: Save package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlatCAM_EVO-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ env.RELEASE_ASSET }}
            ${{ env.RELEASE_ZSYNC }}
          if-no-files-found: error

      - name: Attach package to release
        if: github.event_name == 'release' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" ${RELEASE_ZSYNC:+"$RELEASE_ZSYNC"} --repo "$GH_REPO" --clobber
