  - pyopengl>=3.1.10; python_version < "3.15"
  - pyopengl==4.0.0a9; python_version >= "3.15"
  - PyQt6==6.12.0
  - PyQt6-Qt6==6.12.0
  - PyQt6-Pdf==6.140.0
  - vtracer>=0.6.15
