- conda-forge
dependencies:
- PyQt6
- darkdetect
- ezdxf>=1.4.5
- fontTools
- freetype-py
- gdal
- lxml
- numpy==1.26.4
- olefile>=0.47
- pikepdf>=2.0
- pillow>=9.1
- pip
- pre-commit
